<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0a0910"><link rel="icon" href="assets/icon/icon-192.png"><link rel="apple-touch-icon" href="assets/icon/icon-192.png"></head><body><title>안개호수 낚시꾼</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Gowun+Dodum&display=swap">
<style>
/* Layout: a dark medieval game screen. Scene + command panel on top, tabbed windows below, shop as a modal window. Widget mode floats the scene in a PiP window. Single dark look by choice. */
:root{
  --bg:#0a0910; --fg:#d8ccb0; --muted:#8f8268; --dim:#5a5044;
  --panel:#15121b; --panel2:#1d1924; --panel3:#262030; --ink:#07060a;
  --bronze:#6f5431; --bronze2:#b08c4a; --bronze3:#3b2c18; --gold:#d9b05a;
  --accent:#a8702a; --accent-fg:#fff1d0; --good:#7cbf86; --warn:#d9674f;
  --r0:#a9a497; --r1:#5aa6dc; --r2:#b07fe0; --r3:#e0b24e; --r4:#e8637f;
  --display:"DotGothic16","Gowun Dodum",monospace; --body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(ellipse at 50% 0%,#141020 0%,var(--bg) 70%);color:var(--fg);font-family:var(--body);font-size:13px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;box-sizing:border-box;display:flex;justify-content:center;align-items:flex-start}
*{box-sizing:border-box}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.frame{background:var(--panel);border:2px solid var(--bronze);box-shadow:0 0 0 2px var(--ink),0 0 0 3px var(--bronze3),0 0 0 5px var(--ink)}
.game{position:relative;width:100%;max-width:880px;display:flex;flex-direction:column;gap:10px}
.game.compact{max-width:292px}
.game.compact .cmd,.game.compact .windows,.game.compact .topbar{display:none}
.game.compact .main{grid-template-columns:1fr}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 12px;flex-wrap:wrap}
.topbar h1{font:16px/1 var(--display);margin:0;color:var(--gold);text-shadow:2px 2px 0 #000;letter-spacing:1px}
.topbar .meta{display:flex;gap:14px;font:12px var(--display);color:var(--muted);text-shadow:1px 1px 0 #000;flex-wrap:wrap}
.topbar .meta b{color:var(--fg);font-weight:400}
.main{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:10px;align-items:start}
@media (max-width:640px){.main{grid-template-columns:1fr}}
.sceneBox{position:relative;background:#000;padding:0;max-width:580px}
canvas.scene{display:block;width:100%;aspect-ratio:3/2;max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:absolute;inset:0;pointer-events:none;padding:5px 7px}
.clock{font:20px/1 var(--display);font-variant-numeric:tabular-nums;color:#efe3c2;letter-spacing:1px;text-shadow:2px 2px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000}
.game:not(.compact) .clock{font-size:26px}
.clock small{font-size:.55em;color:#bfae88}
.clock.done,.cmd .big.done{color:var(--gold);text-shadow:2px 2px 0 #000,0 0 10px rgba(217,176,90,.6)}
.bar{width:140px;height:8px}
.status{position:absolute;left:7px;bottom:5px;font:10px var(--display);color:#d8ccb0;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000}
.tod{position:absolute;right:7px;top:6px;font:10px var(--display);color:#bfae88;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000}
.catchPop{position:absolute;left:59.7%;top:38%;width:39%;display:flex;flex-direction:column;align-items:center;gap:1px;font:10px var(--display);text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;line-height:1.2}
.game:not(.compact) .catchPop{font-size:12px}
.catchPop b{font-weight:400}.catchPop span{color:#bfae88}
.bubble{position:absolute;left:3%;top:16%;max-width:38%;background:#efe6cf;color:#1a140f;border:2px solid #0b0a0e;box-shadow:2px 2px 0 #000;padding:4px 7px;font-size:11px;line-height:1.35;font-family:var(--body)}
.bubble::after{content:"";position:absolute;right:-9px;top:40%;border:5px solid transparent;border-left-color:#0b0a0e;border-right:0}
.game:not(.compact) .bubble{font-size:13px}
.bar{width:96px;height:6px;border:1px solid #000;background:#1a1420;box-shadow:0 0 0 1px var(--bronze3);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:#d9b05a;width:0;transition:width .5s linear}
.bar.rest i{background:#5a9ac2}
.compactCtrl{position:absolute;right:5px;bottom:4px;gap:4px}
.game:not(.compact) .compactCtrl{display:none}
.sceneBox.inpip .compactCtrl{display:flex}
.sceneBox.inpip{border:0;box-shadow:none}
.cmd{display:flex;flex-direction:column;gap:8px;padding:10px 12px}
.cmd .big{font:34px/1 var(--display);font-variant-numeric:tabular-nums;text-align:center;color:#fff3d6;text-shadow:3px 3px 0 #000}
.cmd .big small{font-size:14px;color:var(--muted)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row.center{justify-content:center}
.btn{padding:6px 12px;background:var(--panel3);border:2px solid var(--bronze3);box-shadow:inset 0 2px 0 #3a3044,inset 0 -2px 0 #0f0c13,2px 2px 0 #000;font-size:13px;line-height:1.2;color:var(--fg)}
.btn:active{transform:translate(1px,1px)}
.btn.primary{background:#8e5f22;border-color:#4e3310;box-shadow:inset 0 2px 0 #c58a3c,inset 0 -2px 0 #4e3310,2px 2px 0 #000;color:var(--accent-fg);font-family:var(--display);font-size:15px;letter-spacing:1px;padding:8px 18px}
.btn.small{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.icon{width:28px;height:26px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--bronze3);box-shadow:inset 0 2px 0 #3a3044,inset 0 -2px 0 #0f0c13;color:var(--bronze2);flex:none}
.icon svg{width:14px;height:14px;fill:currentColor}
select,input[type=number],input[type=text]{font-family:inherit;font-size:13px;color:var(--fg);background:var(--ink);border:2px solid var(--bronze3);padding:4px 7px}
textarea.code{font-family:inherit;font-size:12px;color:var(--fg);background:var(--ink);border:2px solid var(--bronze3);padding:6px 8px;width:100%;min-height:96px;resize:vertical;word-break:break-all;line-height:1.4}
input[type=number]{width:64px;font-family:var(--display)}
.hint{color:var(--muted);font-size:11px}
.pill{font:12px var(--display);padding:4px 9px;border:2px solid #3a3146;color:var(--muted);background:#0f0c13;letter-spacing:.5px}
.pill.on{color:var(--gold);border-color:var(--bronze2);text-shadow:0 0 6px rgba(217,176,90,.5)}
.windows{display:flex;flex-direction:column}
.tabs{display:flex;background:#0a080e;border-bottom:2px solid var(--bronze3);padding:6px 6px 0;gap:4px;overflow-x:auto}
.tabs button{display:flex;align-items:center;gap:9px;padding:9px 16px 11px;font:16px var(--display);color:var(--muted);text-shadow:1px 1px 0 #000;background:linear-gradient(#1a1520,#100d14);border:2px solid #2a2130;border-bottom:0;box-shadow:inset 0 1px 0 #35293d;position:relative;top:2px;white-space:nowrap}
.tabs button canvas{width:32px;height:32px;image-rendering:pixelated;filter:saturate(.6) brightness(.8)}
.tabs button[aria-selected=true]{color:var(--gold);background:linear-gradient(#2a2232,var(--panel));border-color:var(--bronze);box-shadow:inset 0 2px 0 #5a4630,0 2px 0 var(--panel);top:0;padding-bottom:11px}
.tabs button[aria-selected=true] canvas{filter:none}
.tabs .shopBtn{color:var(--gold);border-color:#5a4322}
.tabs .spacer{flex:1}
.tabs .shopBtn{color:var(--gold);border-left:2px solid var(--bronze3);border-right:0}
.pane{padding:14px;display:flex;flex-direction:column;gap:14px;min-height:260px;font-size:14px}
.sec{font-size:14px}
.gold{font:15px var(--display);color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:1px 1px 0 #000}
/* slots */
.grid{display:flex;flex-wrap:wrap;gap:4px}
.slot{width:64px;height:64px;background:#0d0b12;border:2px solid #2b2434;box-shadow:inset 2px 2px 0 #3a3146,inset -2px -2px 0 #000;display:grid;place-items:center;position:relative;flex:none}
.slot canvas{width:52px;height:52px;image-rendering:pixelated;object-fit:contain}
.slot.fish{width:104px;height:76px}.slot.fish canvas{width:96px;height:64px}
.slot[aria-pressed=true]{border-color:var(--gold)}
.slot.eq::before{content:"E";position:absolute;left:3px;top:1px;font:11px var(--display);color:var(--gold);text-shadow:1px 1px 0 #000}
.slot .cnt{position:absolute;right:3px;bottom:1px;font:11px var(--display);color:#fff;text-shadow:1px 1px 0 #000}
.slot.unk canvas{opacity:0}
.slot.unk::after{content:"?";position:absolute;font:22px var(--display);color:#4a4254}
.slot.lock::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,.5) 0 3px,transparent 3px 6px)}
.slot.r0{box-shadow:inset 1px 1px 0 #3a3146,inset -1px -1px 0 #000}
.slot.r1{border-color:#2b4d66}.slot.r2{border-color:#4a3466}.slot.r3{border-color:#6a5420}.slot.r4{border-color:#6a2a3a}
/* rarity aura: rare glows, epic pulses with motes, legendary adds a shimmer sweep, mythic adds a turning halo */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}
.r1>.fx{box-shadow:inset 0 0 10px rgba(90,166,220,.35)}
.r2>.fx{box-shadow:inset 0 0 12px rgba(176,127,224,.45);animation:fxPulse 2.6s ease-in-out infinite;--c:176,127,224}
.r3>.fx{box-shadow:inset 0 0 14px rgba(224,178,78,.55);animation:fxPulse 2.2s ease-in-out infinite;--c:240,200,100}
.r4>.fx{box-shadow:inset 0 0 16px rgba(232,99,127,.6);animation:fxPulse 1.8s ease-in-out infinite;--c:255,140,170}
.r2>.fx::before,.r3>.fx::before,.r4>.fx::before{content:"";position:absolute;inset:-20% 0 0 0;background:
 radial-gradient(1.5px 1.5px at 18% 80%,rgba(var(--c),1),transparent 60%),radial-gradient(1.5px 1.5px at 72% 90%,rgba(var(--c),1),transparent 60%),
 radial-gradient(1px 1px at 45% 70%,rgba(255,255,255,.9),transparent 60%),radial-gradient(1.5px 1.5px at 88% 60%,rgba(var(--c),.9),transparent 60%),
 radial-gradient(1px 1px at 30% 95%,rgba(255,255,255,.8),transparent 60%),radial-gradient(1.5px 1.5px at 60% 85%,rgba(var(--c),1),transparent 60%);
 background-size:100% 100%;animation:fxRise 3.2s linear infinite}
.r3>.fx::after,.r4>.fx::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,240,200,.28) 50%,transparent 65%);background-size:250% 100%;animation:fxSweep 3.4s ease-in-out infinite}
.r4>.fx::after{background:conic-gradient(from 0deg,transparent,rgba(255,140,170,.25),transparent 30%,rgba(180,140,255,.25),transparent 60%,rgba(255,220,140,.25),transparent 90%);inset:-40%;background-size:auto;animation:fxSpin 6s linear infinite}
.r3.unk>.fx,.r2.unk>.fx,.r4.unk>.fx,.r1.unk>.fx{display:none}
@keyframes fxPulse{0%,100%{opacity:.65}50%{opacity:1}}
@keyframes fxRise{from{transform:translateY(20%);opacity:0}15%{opacity:1}85%{opacity:1}to{transform:translateY(-35%);opacity:0}}
@keyframes fxSweep{0%{background-position:150% 0}60%,100%{background-position:-50% 0}}
@keyframes fxSpin{to{transform:rotate(360deg)}}
.haul .f{position:relative;overflow:hidden;flex-shrink:0}
.tankWrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;align-items:stretch}
@media (max-width:640px){.tankWrap{grid-template-columns:1fr}}
.tankSide{display:flex;flex-direction:column;gap:4px;background:#0f0c13;border:2px solid var(--bronze3);padding:8px;max-height:260px;overflow:auto;min-width:0}
.tsp{display:grid;grid-template-columns:48px 1fr auto;gap:8px;align-items:center;font-size:12px;padding:2px 4px;border-left:3px solid currentColor}
.tsp canvas{width:48px;height:32px}
.tsp .hint{white-space:nowrap}
.haul .f.r0,.haul .f.r1,.haul .f.r2,.haul .f.r3,.haul .f.r4{color:var(--fg)}
.haul .f>.fx{z-index:0}.haul .f>*:not(.fx){position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.fx,.fx::before,.fx::after{animation:none!important}}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}.r4{color:var(--r4)}
/* detail card */
.card{display:grid;grid-template-columns:104px 1fr;gap:12px;background:#0f0c13;border:2px solid var(--bronze3);box-shadow:inset 0 0 0 1px #000;padding:12px}
.card .art{width:104px;height:104px;background:#07060a;border:2px solid #2b2434;display:grid;place-items:center}
.card .art canvas{width:96px;height:96px;image-rendering:pixelated}
.card h3{margin:0;font:18px var(--display);text-shadow:1px 1px 0 #000}
.card .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin-top:6px}
.card .kv span:nth-child(odd){color:var(--muted)}
.card .desc{grid-column:1/-1;font-size:12px;color:#c4b797;border-top:1px solid #2b2434;padding-top:6px;margin-top:4px;line-height:1.5}
.card .act{grid-column:1/-1;display:flex;justify-content:flex-end;gap:6px}
.sec{font:12px var(--display);color:var(--bronze2);letter-spacing:1px;text-shadow:1px 1px 0 #000;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--bronze3)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--panel2);border:2px solid #0f0c13;box-shadow:inset 0 0 0 1px #3a3146;padding:5px 8px}
.stat .k{font-size:11px;color:var(--muted)}
.stat .v{font:17px var(--display);color:#fff3d6;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,10px);gap:2px;justify-content:start;overflow-x:auto;padding-bottom:2px}
.cal i{width:10px;height:10px;background:#0f0c13;box-shadow:inset 0 0 0 1px #2a2232;display:block}
.cal i.l1{background:#4e3a1c}.cal i.l2{background:#7a5a22}.cal i.l3{background:#b5852c}.cal i.l4{background:var(--gold)}
.taglist{display:flex;flex-direction:column;gap:3px;font-size:12px}
.taglist div{display:flex;justify-content:space-between}
.taglist b{font:12px var(--display);color:#fff3d6}
.setting{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.setting .hint{display:block}
.eqrow{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;background:var(--panel2);border:2px solid #0f0c13;box-shadow:inset 0 0 0 1px #3a3146;padding:6px 8px}
.eqrow .k{font:11px var(--display);color:var(--muted)}
.eqrow .n{font-weight:700}
.eqrow .e{font-size:11px;color:#c4b797}
/* modal windows */
.overlay{position:absolute;inset:0;background:rgba(4,3,8,.78);display:flex;align-items:center;justify-content:center;padding:12px;z-index:5}
.win{background:#0c0a10;border:2px solid var(--bronze);box-shadow:0 0 0 2px var(--ink),0 0 0 3px #4a3a22,0 0 0 5px var(--ink),0 12px 30px #000;width:100%;max-width:560px;max-height:100%;display:flex;flex-direction:column}
.win .title{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:linear-gradient(#241d2b,#15111b);border-bottom:2px solid var(--bronze3);font:14px var(--display);color:var(--gold);text-shadow:1px 1px 0 #000}
.win .title button{color:var(--warn);font:16px var(--display);width:22px;height:22px;border:2px solid var(--bronze3);background:#0f0c13}
.win .body{padding:10px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.win h2{font:18px var(--display);margin:0;color:var(--gold);text-shadow:2px 2px 0 #000}
.cats{display:flex;gap:4px;flex-wrap:wrap}
.cats button{padding:4px 9px;font:12px var(--display);border:2px solid var(--bronze3);background:#15121b;color:var(--muted);box-shadow:1px 1px 0 #000}
.cats button[aria-selected=true]{color:var(--gold);border-color:var(--bronze2)}
.shopGrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
@media (max-width:640px){.shopGrid{grid-template-columns:1fr}}
.cats button{font-size:14px;padding:6px 12px}
.chars{display:flex;flex-direction:column;gap:6px}
.chars button{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;text-align:left;padding:6px 9px;border:2px solid var(--bronze3);background:var(--panel2);box-shadow:1px 1px 0 #000}
.chars button[aria-pressed=true]{border-color:var(--bronze2);background:var(--panel3)}
.chars canvas{width:32px;height:48px;image-rendering:pixelated}
.chars .n{font-weight:700}.chars .d{font-size:12px;color:var(--muted)}
.haul{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow:auto}
.haul .f{display:grid;grid-template-columns:96px 1fr auto auto;gap:8px;align-items:center;padding:3px 8px;background:var(--panel2);font-size:13px;opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s}
.haul .f canvas{width:96px;height:64px;image-rendering:pixelated}
.haul .f.in{opacity:1;transform:none}
.haul .f{border:2px solid transparent;text-align:left;color:var(--fg)}
.haul .f.tanked{border-color:#3a6a8a;background:#14202c}
.haul .f .tag{font:10px var(--display);color:var(--gold)}
.total{display:flex;justify-content:space-between;font-size:14px;padding-top:6px;border-top:2px solid var(--bronze3)}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);border:2px solid var(--bronze);padding:5px 10px;font-size:12px;z-index:6;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
.toast.show{opacity:1}
#pipVideo{position:absolute;left:0;top:0;width:4px;height:3px;opacity:.02;pointer-events:none}
@media (prefers-reduced-motion:reduce){.haul .f{transition:none}.bar i{transition:none}}

.tabs button.alert::after{content:"";width:7px;height:7px;background:var(--gold);box-shadow:0 0 6px var(--gold);margin-left:2px;border:1px solid #000}
.qboard{position:relative;padding:14px 12px 12px;background:repeating-linear-gradient(0deg,#2a1e14 0 22px,#1f160e 22px 24px),#24190f;border:3px solid #120c08;box-shadow:inset 0 0 0 2px #3b2a1a,inset 0 0 24px #000}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.qhead h3{margin:0;font:18px var(--display);color:var(--gold);text-shadow:2px 2px 0 #000}
.qboard .hint{color:#a8987a}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.qgrid{grid-template-columns:1fr}}
.note{position:relative;background:linear-gradient(#c9b78f,#b4a078);color:#2a1d12;padding:12px 10px 10px;border:1px solid #6b5636;box-shadow:2px 3px 0 #0008,inset 0 0 18px #7a623a88;display:flex;flex-direction:column;gap:6px;min-height:230px}
.note:nth-child(3n+1){transform:rotate(-1deg)}.note:nth-child(3n+2){transform:rotate(.8deg)}.note:nth-child(3n){transform:rotate(-.5deg)}
.note::before{content:"";position:absolute;top:-6px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#7a2a22;box-shadow:0 0 0 2px #2a0f0c,1px 1px 0 #000}
.note .who{font:11px var(--display);color:#5c4628;letter-spacing:.5px}
.note h4{margin:0;font:15px var(--display);color:#22160c}
.note .art{background:#10161f;border:2px solid #3b2a1a;height:72px;display:grid;place-items:center}
.note .art canvas{width:96px;height:64px;image-rendering:pixelated}
.note .art .big{font:13px var(--display);color:#d9a35a;text-align:center;padding:0 6px}
.note .cond{font-size:11px;color:#4a3820}
.note .prog{display:flex;align-items:center;gap:6px;font:12px var(--display)}
.note .prog .bar{width:auto;flex:1;height:7px;margin:0;background:#3b2a1a;box-shadow:none;border:1px solid #2a1d12}
.note .prog .bar i{background:#6a3a1a}
.note .rew{font-size:12px;border-top:1px dashed #6b5636;padding-top:6px}
.note .rew b{color:#6a3a10}
.note .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:6px}
.note .foot .t{font-size:10px;color:#5c4628}

const KEY='mistlake.v2';
let S=null;
const fresh=()=>({v:2,q:null,savedAt:0,char:null,gold:0,own:{rod0:1,net0:1,con0:1},eq:{rod:'rod0',net:'net0',contract:'con0',bait:null,charm:null,lantern:null,ally:null},bait:{},maps:[0],tanks:[[]],tankSel:0,codex:{},totalSec:0,days:{},tags:['공부','작업'],lastTag:'공부',spot:0,muted:false,vol:0.5,goalMin:0,breakMin:0,run:null,brk:null,sessions:0,compact:false});
let wakeSentinel=null;
async function wakeLock(){try{if(S.wake&&S.run&&!wakeSentinel&&navigator.wakeLock){wakeSentinel=await navigator.wakeLock.request('screen');wakeSentinel.addEventListener('release',()=>{wakeSentinel=null})}else if((!S.wake||!S.run)&&wakeSentinel){await wakeSentinel.release();wakeSentinel=null}}catch(e){wakeSentinel=null}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wakeLock()});
function loadLocal(){try{const j=localStorage.getItem(KEY);return j?JSON.parse(j):null}catch(e){return null}}
S=Object.assign(fresh(),loadLocal()||{});
if(S.tank&&!S.tanks)S.tanks=[S.tank];if(!S.tanks||!S.tanks.length)S.tanks=[[]];S.tankSel=Math.min(S.tankSel||0,S.tanks.length-1);
const curTank=()=>S.tanks[S.tankSel]||S.tanks[0];
let db=null,uid=null,saveT=null,lastRemote=0,remoteBusy=false;
function save(){S.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(saveT);saveT=setTimeout(saveRemote,2500)}
async function saveRemote(){if(!db||!uid||remoteBusy)return;remoteBusy=true;try{await db.doc('data/users/'+uid+'/save').set(JSON.parse(JSON.stringify(S)));lastRemote=S.savedAt}catch(e){}remoteBusy=false;if(lastRemote!==S.savedAt){clearTimeout(saveT);saveT=setTimeout(saveRemote,3000)}}
(async()=>{try{const u=await claude.use('user');db=await claude.use('db');if(!u||!db)return;uid=await u.id();if(!uid){db=null;return}
  const snap=await db.doc('data/users/'+uid+'/save').get();const d=snap.exists?snap.data():null;
  if(d&&d.v===2&&d.savedAt>(S.savedAt||0)&&!(S.run&&!d.run)){S=Object.assign(fresh(),d);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}renderAll();toast('저장된 기록을 불러왔어요')}
  else if(S.savedAt)saveRemote();}catch(e){}})();

// ---------- helpers ----------
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const dayKey=d=>{d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
function timeOfDay(h){h=h??new Date().getHours();return h<5?'night':h<7?'dawn':h<17?'day':h<19?'dusk':'night'}
const fmtH=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}시간 ${m}분`:`${m}분`};
const fmtClock=s=>`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}<small>:${pad(Math.floor(s%60))}</small>`;
const charOf=()=>CHARS.find(c=>c.id===S.char)||CHARS[0];
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
const rand=(a,b)=>a+Math.random()*(b-a);
const eqv=cat=>{const v=item(S.eq[cat])?.v;return typeof v==='number'?v:0};
const charm=k=>{const v=item(S.eq.charm)?.v;return v&&typeof v==='object'?(v[k]||0):0};
const baitLuck=()=>{const b=S.eq.bait;return b&&S.bait[b]>0?item(b).v:0};
const tankCap=()=>8+ITEMS.filter(i=>i.cat==='tank'&&S.own[i.id]).reduce((a,i)=>a+i.v,0);

const allyExtra=(spot,at)=>{const a=item(S.eq.ally);if(!a)return 0;const tod=timeOfDay(new Date(at).getHours());return a.v.extra+(a.v.spot===spot?0.10:0)+(a.v.tod===tod?0.08:0)};
const extraLine=(spot,at)=>allyExtra(spot,at)+perk('pext')*0.1;

function catchInterval(){let s=600/(1+eqv('rod')+charm('speed')+perk('pspeed')*0.08);if(S.char==='bard')s*=0.95;return s*rand(0.7,1.3)}
function rollFish(spot,elapsedSec,at){
  const tod=timeOfDay(new Date(at).getHours());
  const pool=spot.fish.filter(f=>!f.time||f.time===tod);
  let luck=baitLuck()+charm('luck')+perk('pluck')*0.04+oddCount()*0.01+Math.min(elapsedSec/7200,1)*0.3;if(S.char==='mage')luck+=0.08;
  if(tod==='night'||tod==='dawn')luck+=eqv('lantern')+charm('nightluck');
  const w=[70,20,7,2.5,0.5].map((x,i)=>i?x*(1+luck):x);
  let r=Math.random()*w.reduce((a,b)=>a+b),ri=0;for(;ri<5;ri++){r-=w[ri];if(r<0)break}
  let cands=pool.filter(f=>f.r===ri);while(!cands.length&&ri>0){ri--;cands=pool.filter(f=>f.r===ri)}
  let f=cands[Math.floor(Math.random()*cands.length)];
  if(S.char==='druid'&&(tod==='night'||tod==='dawn')&&Math.random()<0.1){const sp=pool.filter(x=>x.time);if(sp.length)f=sp[Math.floor(Math.random()*sp.length)]}
  const cm=Math.round(f.min+Math.pow(Math.random(),1.6)*(f.max-f.min));
  if(S.eq.bait&&S.bait[S.eq.bait]>0)S.bait[S.eq.bait]--;
  return {id:f.id,cm};
}

function tickFishing(now){

// ---------- save code (copy / paste) ----------
const CODE_TAG='MLK2';
function codeHash(t){let h=5381;for(let i=0;i<t.length;i++)h=(h*33^t.charCodeAt(i))>>>0;return h.toString(16).padStart(8,'0')}
function b64enc(str){const u=new TextEncoder().encode(str);let b='';for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64dec(b){b=b.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u)}
function makeSaveCode(){const body=b64enc(JSON.stringify(S));return CODE_TAG+'.'+body+'.'+codeHash(body)}
function parseSaveCode(text){
  const t=(text||'').replace(/\s+/g,'');const m=t.match(/^MLK2\.([A-Za-z0-9_-]+)\.([0-9a-f]{8})$/);
  let d;
  if(!m&&t.startsWith('ML2.')){try{d=JSON.parse(decodeURIComponent(escape(atob(t.slice(4)))))}catch(e){return{err:'저장 코드를 읽을 수 없어요'}}}
  else{if(!m)return{err:'저장 코드 형식이 아니에요. 처음부터 끝까지 빠짐없이 붙여넣어 주세요'};
  if(codeHash(m[1])!==m[2])return{err:'저장 코드가 손상됐어요. 다시 복사해 주세요'};
  try{d=JSON.parse(b64dec(m[1]))}catch(e){return{err:'저장 코드를 읽을 수 없어요'}}}
  if(!d||typeof d!=='object'||d.v!==2||typeof d.own!=='object'||typeof d.eq!=='object'||!Array.isArray(d.maps))return{err:'이 게임의 저장 코드가 아니에요'};
  return{data:d};
}
function applySaveData(d){S=Object.assign(fresh(),d);if(S.tank&&!S.tanks)S.tanks=[S.tank];if(!S.tanks||!S.tanks.length)S.tanks=[[]];S.tankSel=Math.min(S.tankSel||0,S.tanks.length-1);if(!S.maps.includes(S.spot))S.spot=S.maps[0]||0;codexSel=null;save();audio.setVol();renderAll()}

// ---------- quest board (의뢰판) ----------
// Three notices on the inn board. An empty slot gets a new notice after an hour; a notice stays up for a day.
// Rewards = the work's expected fishing income × (35% + 3% per reputation level), plus (for deliveries) the
// sale value of the fish handed over, so a notice always pays a little better than just selling.
const Q_SLOTS=3,Q_POST_MS=60*60000,Q_LIFE_MS=24*3600000;
const Q_REP=[3,8,15,25,40];
const Q_CLIENTS=['여관 주인 브람','등대지기 노파','마법사 길드','대장장이 두린','수도원 요리사','늙은 선장 오스릭','요정 사서','우물지기 소년','떠돌이 연금술사','성의 집사'];
const Q_W=[70,20,7,2.5,0.5],Q_WS=Q_W.reduce((a,b)=>a+b);
const qPick=a=>a[Math.floor(Math.random()*a.length)];
const qRepLv=()=>{const x=(S.q&&S.q.xp)||0;let l=0;while(l<Q_REP.length&&x>=Q_REP[l])l++;return l};
const qSaleMul=()=>(1+eqv('contract')+charm('gold'))*(1+Object.keys(S.codex).length*0.01)*1.15*(S.char==='rogue'?1.05:1);
const qAvg=(sp,r)=>{const fs=SPOTS[sp].fish.filter(f=>f.r===r);return fs.length?fs.reduce((a,f)=>a+f.price,0)/fs.length:0};
const qEV=sp=>{let v=0;for(let r=0;r<5;r++)v+=Q_W[r]/Q_WS*qAvg(sp,r);return v*qSaleMul()};
const qRound=v=>v<100?Math.max(5,Math.round(v/5)*5):v<1000?Math.round(v/10)*10:Math.round(v/50)*50;
function qReward(sp,catches,extra=0){
  const k=0.35+qRepLv()*0.03;const gold=qRound(extra+k*catches*qEV(sp));const rw={gold,xp:Math.max(1,Math.min(3,Math.round(catches/6)))};
  if(Math.random()<0.35){const tierMax=Math.max(...S.maps)+1;const b=ITEMS.filter(i=>i.cat==='bait'&&i.tier<=tierMax&&i.price/2<=gold*0.5).sort((a,c)=>c.price-a.price)[0];
    if(b){rw.bait=b.id;rw.baitN=10;rw.gold=qRound(gold-b.price/2*0.8)}}
  return rw}
function qMakeNote(now){
  const q=S.q,open=S.maps.slice().sort((a,b)=>a-b);const sp=Math.random()<0.5&&open.includes(S.spot)?S.spot:qPick(open);
  const kind=qPick(['deliver','deliver','catch','time']);
  const n={id:++q.seq,kind,spot:sp,client:qPick(Q_CLIENTS),postedAt:now,expireAt:now+Q_LIFE_MS,prog:0,done:false};
  if(kind==='deliver'){
    let r=Math.random()<0.7?0:1;let c=SPOTS[sp].fish.filter(f=>f.r===r&&!f.time);if(!c.length){r=0;c=SPOTS[sp].fish.filter(f=>f.r===0&&!f.time)}
    const f=qPick(c),p=Q_W[r]/Q_WS/c.length,goal=Math.max(1,Math.min(4,Math.round(12*p)));
    Object.assign(n,{fish:f.id,goal},qReward(sp,goal/p,goal*f.price*qSaleMul()));
  }else if(kind==='catch'){
    const R=qRepLv()>=3&&Math.random()<0.3?3:(Math.random()<0.6?1:2);let p=0;for(let r=R;r<5;r++)p+=Q_W[r]/Q_WS;
    const goal=R===1?3+Math.floor(Math.random()*3):R===2?1+Math.floor(Math.random()*2):1;
    Object.assign(n,{rar:R,goal},qReward(sp,goal/p));if(R>=3)n.expireAt=now+Q_LIFE_MS*2;
  }else{
    const tod=Math.random()<0.4?qPick(['day','night','dusk']):null;const mins=tod==='dusk'?qPick([40,60]):qPick([40,60,90,120]);
    if(tod){n.tod=tod;n.spot=null}
    Object.assign(n,{goal:mins*60},qReward(tod?Math.max(...open):sp,mins/10));
  }
  return n}
function qUpdate(now=Date.now()){
  if(!S.q){S.q={notes:[],nextAt:0,xp:0,done:0,seq:0};for(let i=0;i<Q_SLOTS;i++)S.q.notes.push(qMakeNote(now));save();qBadge();return}
  const q=S.q;let ch=false;const n0=q.notes.length;q.notes=q.notes.filter(n=>n.done||n.expireAt>now);if(q.notes.length!==n0)ch=true;
  if(q.notes.length<Q_SLOTS&&!q.nextAt){q.nextAt=now+Q_POST_MS;ch=true}
  while(q.notes.length<Q_SLOTS&&q.nextAt&&q.nextAt<=now){q.notes.push(qMakeNote(q.nextAt));q.nextAt=q.notes.length<Q_SLOTS?q.nextAt+Q_POST_MS:0;ch=true;toast('의뢰판에 새 의뢰가 붙었어요')}
  if(q.notes.length>=Q_SLOTS&&q.nextAt){q.nextAt=0;ch=true}
  if(ch){save();qBadge();if(tab==='quest')renderPane()}
}
function tankSellPrice(c){const f=fishById(c.id);let p=f.price*(1+eqv('contract')+charm('gold')+perk('pgold')*0.1+(oddCount()>=ODD.length?0.1:0))*(1+Object.keys(S.codex).length*0.01)*(1+(c.cm-f.min)/(f.max-f.min)*0.3);if(S.char==='rogue')p*=1.05;return Math.round(p)}
function tankDeliverNote(c){return S.q?S.q.notes.find(n=>!n.done&&n.kind==='deliver'&&n.fish===c.id):null}
function qDone(n){if(n.done||n.prog<n.goal)return;n.done=true;n.prog=n.goal;toast('의뢰 완료! 의뢰판에서 보상을 받으세요');audio.rare();qBadge()}
function qOnCatch(c,spot){if(!S.q)return;const f=fishById(c.id);S.q.notes.forEach(n=>{if(!n.done&&n.kind==='catch'&&n.spot===spot&&f.r>=n.rar){n.prog++;qDone(n)}})}
function qOnTick(now){
  if(!S.q||!S.run)return;const R=S.run,last=R.qAt||R.startAt;if(now<=last)return;R.qAt=now;let saveNow=false;
  S.q.notes.forEach(n=>{if(n.done||n.kind!=='time')return;let add=0;
    if(n.tod){for(let t=last;t<now;t+=60000){const e=Math.min(now,t+60000);if(timeOfDay(new Date(t).getHours())===n.tod)add+=(e-t)/1000}}
    else if(n.spot===R.spot)add=(now-last)/1000;
    if(add>0){const m0=Math.floor(n.prog/60);n.prog=Math.min(n.goal,n.prog+add);if(Math.floor(n.prog/60)!==m0)saveNow=true;qDone(n)}});
  if(saveNow){save();if(tab==='quest')renderPane()}
}
function qClaim(n){
  const q=S.q,lv0=qRepLv();S.gold+=n.gold;if(n.bait){S.bait[n.bait]=(S.bait[n.bait]||0)+n.baitN;if(!S.eq.bait)S.eq.bait=n.bait}
  q.xp+=n.xp;q.done++;q.notes=q.notes.filter(x=>x!==n);if(!q.nextAt)q.nextAt=Date.now()+Q_POST_MS;
  save();renderTop();audio.rare();toast(`의뢰 보상: ${n.gold.toLocaleString()} G${n.bait?' · '+item(n.bait).name+' ×'+n.baitN:''}`);
  if(qRepLv()>lv0)setTimeout(()=>toast(`여관 평판이 올랐어요 · 의뢰 보상 +${qRepLv()*3}%`),2400);
  qBadge();renderPane()}
function qDrop(n){const q=S.q;q.notes=q.notes.filter(x=>x!==n);if(!q.nextAt)q.nextAt=Date.now()+Q_POST_MS;save();qBadge();renderPane()}
const qRerollCost=()=>qRound(qEV(Math.max(...S.maps))*2.5);
function qReroll(){const c=qRerollCost();if(S.gold<c||S.q.notes.length>=Q_SLOTS)return;S.gold-=c;S.q.notes.push(qMakeNote(Date.now()));if(S.q.notes.length>=Q_SLOTS)S.q.nextAt=0;save();renderTop();qBadge();renderPane()}
function qBadge(){const b=document.querySelector('#tabs [data-tab=quest]');if(!b)return;b.classList.toggle('alert',!!(S.q&&S.q.notes.some(n=>n.done)))}
function qTitle(n){
  if(n.kind==='deliver')return `${fishById(n.fish).name} ${n.goal}마리 납품`;
  if(n.kind==='catch')return `${RAR[n.rar]} 이상 ${n.goal}마리 낚기`;
  return n.tod?`${TIMES[n.tod]}에 ${n.goal/60}분 낚시`:`${SPOTS[n.spot].name}에서 ${n.goal/60}분 낚시`}
function qCond(n){
  if(n.kind==='deliver')return `${SPOTS[n.spot].name} · 귀항할 때 어망에서 넘겨요`;
  if(n.kind==='catch')return `${SPOTS[n.spot].name} · 출항 중에 저절로 세요`;
  return n.tod?`어느 낚시터든 · ${TIMES[n.tod]} 시간대에 출항`:`${SPOTS[n.spot].name} · 출항 중에 저절로 쌓여요`}
function qProg(n){return n.kind==='time'?`${Math.floor(n.prog/60)} / ${n.goal/60}분`:`${n.prog} / ${n.goal}마리`}
function qLeft(ms){const m=Math.max(0,Math.round(ms/60000));return m>=60?`${Math.floor(m/60)}시간 ${m%60}분`:`${m}분`}
function renderQuest(p){
  qUpdate();const q=S.q,now=Date.now();
  const board=document.createElement('div');board.className='qboard';
  board.innerHTML=`<div class="qhead"><h3>여관 의뢰판</h3><span class="hint">빈 자리에는 한 시간마다 새 의뢰가 붙어요 · 의뢰는 하루 동안 걸려 있어요</span></div>`;
  const grid=document.createElement('div');grid.className='qgrid';
  q.notes.forEach(n=>{const d=document.createElement('div');d.className='note'+(n.done?' done':'');
    const rew=`<b>${n.gold.toLocaleString()} G</b>${n.bait?` · <b>${item(n.bait).name} ×${n.baitN}</b>`:''}`;
    d.innerHTML=`<div class="who">${n.client}</div><h4>${qTitle(n)}</h4><div class="art"></div><div class="cond">${qCond(n)}</div>
      <div class="prog"><span>${qProg(n)}</span><div class="bar"><i style="width:${Math.round(n.prog/n.goal*100)}%"></i></div></div>

// Painted art in assets/fish/<id>.png (96x64) and <id>@2.png (192x128) is preferred; the drawn version is the fallback.
function loadFishArt(){allFish().forEach(f=>{if(fishImgTried[f.id])return;fishImgTried[f.id]=1;const im=new Image();im.onload=()=>{fishImg[f.id]=im;delete fishHD[f.id];delete fishSD[f.id];if(typeof renderPane==='function')renderPane()};im.src='assets/fish/'+f.id+'.png';const im2=new Image();im2.onload=()=>{fishImg2[f.id]=im2;if(typeof renderPane==='function')renderPane()};im2.src='assets/fish/'+f.id+'@2.png'})}
function fishCanvasHD(f){if(fishHD[f.id])return fishHD[f.id];if(fishImg[f.id]){const c=document.createElement('canvas');c.width=96;c.height=64;c.getContext('2d').drawImage(fishImg[f.id],0,0,96,64);return fishHD[f.id]=c}return fishHD[f.id]=renderFish(FISH3[f.id],f.r)}
function fishCanvasSD(f){if(fishSD[f.id])return fishSD[f.id];if(fishImg[f.id]){const c=document.createElement('canvas');c.width=48;c.height=32;const g=c.getContext('2d');g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(fishImg[f.id],0,0,48,32);return fishSD[f.id]=c}return fishSD[f.id]=renderFish(FISH3[f.id],f.r,0.5)}
function fishCanvasXL(f){if(fishImg2[f.id]){const c=document.createElement('canvas');c.width=192;c.height=128;c.getContext('2d').drawImage(fishImg2[f.id],0,0,192,128);return c}return null}
function drawFish(g,f,x,y,scale=1){const c=fishCanvasSD(f);g.imageSmoothingEnabled=false;g.drawImage(c,x,y,48*scale,32*scale)}
function drawFishHD(g,f,x,y,scale=1){const c=fishCanvasHD(f);g.imageSmoothingEnabled=false;g.drawImage(c,x,y,96*scale,64*scale)}

function bevelCanvas(oc,outline){
  const g=oc.getContext('2d'),w=oc.width,h=oc.height;const img=g.getImageData(0,0,w,h),d=img.data;
  const isEdge=(x,y)=>{if(x<0||y<0||x>=w||y>=h)return true;const i=(y*w+x)*4;if(d[i+3]<10)return true;return outline&&d[i]===outline[0]&&d[i+1]===outline[1]&&d[i+2]===outline[2]};
  const src=new Uint8ClampedArray(d);const ed=(x,y)=>{const i=(y*w+x)*4;return src[i+3]<10||(outline&&src[i]===outline[0]&&src[i+1]===outline[1]&&src[i+2]===outline[2])};
  const isE=(x,y)=>x<0||y<0||x>=w||y>=h||ed(x,y);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(ed(x,y))continue;const i=(y*w+x)*4;let k=0;
    if(isE(x,y-1)||isE(x-1,y))k=0.22;else if(isE(x,y+1)||isE(x+1,y))k=-0.28;
    else if(isE(x,y+2)||isE(x+2,y)){if((x+y)%2===0)k=-0.14}else if(isE(x,y-2)||isE(x-2,y)){if((x+y)%2===0)k=0.1}
    if(k){d[i]=Math.max(0,Math.min(255,src[i]+255*k*(k>0?0.9:1)));d[i+1]=Math.max(0,Math.min(255,src[i+1]+255*k*(k>0?0.9:1)));d[i+2]=Math.max(0,Math.min(255,src[i+2]+255*k))}}
  g.putImageData(img,0,0);return oc;
}

  g.fillStyle='#14314a';for(let i=0;i<6;i++){const x=(i*31+Math.floor(t/400))%150-4;g.fillRect(x,6+i*8,3,1)}
  g.fillStyle='#3a3340';g.fillRect(0,50,144,6);g.fillStyle='#4a4250';for(let i=0;i<144;i+=7)g.fillRect(i+(i%14?2:0),51,3,1);
  g.fillStyle='#2a3d22';[[12,42],[40,44],[96,40],[128,44]].forEach(([x,y])=>{g.fillRect(x,y,2,8);g.fillRect(x+3,y+3,2,5)});
  g.fillStyle='rgba(120,180,220,0.08)';g.fillRect(0,0,144,2);
  curTank().forEach((c,i)=>{const f=fishById(c.id);const key=S.tankSel+':'+i;const sw=tankSwim[key]||(tankSwim[key]={x:Math.random()*120,y:6+Math.random()*34,dir:1,sp:.08+Math.random()*.1,ph:Math.random()*6});
    sw.x+=sw.dir*sw.sp;if(sw.x>118){sw.dir=-1}if(sw.x<2){sw.dir=1}const y=sw.y+Math.sin(t/900+sw.ph)*2;
    g.save();g.setTransform(1,0,0,1,0,0);const fx=Math.floor(sw.x)*2,fy=Math.floor(y)*2;if(sw.dir<0){g.translate(fx+48,fy);g.scale(-1,1);drawFish(g,f,0,0,1)}else drawFish(g,f,fx,fy,1);g.restore()});
  g.fillStyle='rgba(0,0,0,0.35)';g.fillRect(0,0,144,1);g.fillRect(0,0,1,56);g.fillRect(143,0,1,56);g.setTransform(1,0,0,1,0,0);
}
requestAnimationFrame(frame);
// logic also runs on a plain interval, so catches and the goal still fire while the tab is in the background (rAF pauses there)
function goalReached(){const R=S.run;if(!R||R.goalDone)return;R.goalDone=true;save();audio.fanfare();say('idle');renderTimer();
  const o=overlay(`<h2 style="text-align:center">완주 달성!</h2><div class="hint" style="text-align:center">목표 ${S.goalMin}분을 채웠어요. 귀항하면 완주 보너스가 붙어요.<br>계속 낚시해도 보너스는 유지돼요.</div><div class="row center" style="margin-top:6px"><button class="btn" id="goalGo">계속 낚시</button><button class="btn primary" id="goalEnd">지금 귀항</button></div>`);
  o.querySelector('#goalGo').onclick=()=>o.remove();o.querySelector('#goalEnd').onclick=()=>{o.remove();endRun()}}
let qTickN=0;qUpdate();
setInterval(()=>{const now=Date.now();holdPause(now);if(++qTickN%30===0)qUpdate(now);if(S.run){tickFishing(now);qOnTick(now);const s=Math.floor((now-S.run.startAt)/1000);try{const gS=S.goalMin*60;const disp=S.goalMin&&s<gS?gS-s:s;$('clock').innerHTML=fmtClock(disp);$('bigClock').innerHTML=fmtClock(disp);$('status').textContent=statusText()}catch(e){}if(S.goalMin&&s>=S.goalMin*60&&!S.run.goalDone)goalReached()}
  else if(S.brk&&!S.brk.rang&&S.brk.endAt<=now){S.brk.rang=true;audio.bell();toast('다시 출항할 시간이에요');renderTimer();save()}},1000);

// ---------- audio ----------
const audio=(()=>{
  let ac=null,master,music,delay,chord=0;
  const DAY=[0,2,4,7,9,12,14,16],NIGHT=[0,3,5,7,10,12,15,17];
  const freq=(root,st)=>root*Math.pow(2,st/12);
  function unlock(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();build()}catch(e){return}}if(S.muted){if(ac.state==='running')ac.suspend()}else if(ac.state==='suspended')ac.resume()}
  function build(){
    master=ac.createGain();master.connect(ac.destination);music=ac.createGain();music.connect(master);
    delay=ac.createDelay(2);delay.delayTime.value=0.46;const fb=ac.createGain();fb.gain.value=0.38;const lp=ac.createBiquadFilter();lp.frequency.value=1800;delay.connect(fb);fb.connect(lp);lp.connect(delay);delay.connect(music);
    const buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=buf.getChannelData(0);let b0=0;for(let i=0;i<d.length;i++){b0=0.98*b0+0.02*(Math.random()*2-1);d[i]=b0*3}
    const noise=ac.createBufferSource();noise.buffer=buf;noise.loop=true;const nf=ac.createBiquadFilter();nf.type='lowpass';nf.frequency.value=380;const ng=ac.createGain();ng.gain.value=0.3;
    const lfo=ac.createOscillator();lfo.frequency.value=0.11;const lg=ac.createGain();lg.gain.value=0.12;lfo.connect(lg);lg.connect(ng.gain);lfo.start();noise.connect(nf);nf.connect(ng);ng.connect(music);noise.start();
    setVol();schedule();pad();
  }
  function setVol(){if(!master)return;master.gain.cancelScheduledValues(ac.currentTime);master.gain.setValueAtTime(S.muted?0:S.vol*0.6,ac.currentTime);master.gain.value=S.muted?0:S.vol*0.6;if(S.muted){ac.suspend().catch(()=>{})}else if(ac.state!=='running')ac.resume().catch(()=>{})}
  function retune(){chord=0}
  function scale(){const n=timeOfDay()==='night'||timeOfDay()==='dawn';return{root:n?196:220,st:n?NIGHT:DAY,gap:n?[1.8,3.8]:[1.3,3]}}
  function pluck(f,g,dur,type){const o=ac.createOscillator();o.type=type||'triangle';o.frequency.value=f;const e=ac.createGain();e.gain.setValueAtTime(0,ac.currentTime);e.gain.linearRampToValueAtTime(g,ac.currentTime+0.02);e.gain.exponentialRampToValueAtTime(0.0005,ac.currentTime+dur);o.connect(e);e.connect(music);e.connect(delay);o.start();o.stop(ac.currentTime+dur+0.1)}
  function schedule(){const sc=scale();const st=sc.st[Math.floor(Math.random()*sc.st.length)];pluck(freq(sc.root,st+(Math.random()<0.3?12:0)),0.07+Math.random()*0.04,2.6,'triangle');setTimeout(schedule,rand(sc.gap[0],sc.gap[1])*1000)}
  function pad(){const sc=scale();const chords=[[0,7,16],[-3,4,12],[5,12,19],[-5,2,9]];const c=chords[chord%4];chord++;
    c.forEach(st=>{const o=ac.createOscillator();o.type='sine';o.frequency.value=freq(sc.root/2,st);const o2=ac.createOscillator();o2.type='sine';o2.frequency.value=freq(sc.root/2,st)*1.004;const e=ac.createGain();e.gain.setValueAtTime(0,ac.currentTime);e.gain.linearRampToValueAtTime(0.03,ac.currentTime+4);e.gain.setValueAtTime(0.03,ac.currentTime+12);e.gain.linearRampToValueAtTime(0,ac.currentTime+16);o.connect(e);o2.connect(e);e.connect(music);o.start();o2.start();o.stop(ac.currentTime+16.5);o2.stop(ac.currentTime+16.5)});
    setTimeout(pad,15000)}
  function chime(r){if(!ac||S.muted)return;if(r>=2){rare();return}[0,4,7].forEach((st,i)=>setTimeout(()=>pluck(freq(440,st+12),0.06,1.2,'sine'),i*90))}
  function rare(){if(!ac||S.muted)return;[0,7,12,16].forEach((st,i)=>setTimeout(()=>pluck(freq(330,st+12),0.08,1.8,'sine'),i*120))}
  function bell(){if(!ac||S.muted)return;pluck(880,0.12,3,'sine');setTimeout(()=>pluck(1320,0.05,3,'sine'),30)}
  function fanfare(){if(!ac||S.muted)return;[[0,0],[4,120],[7,240],[12,360],[12,600],[16,720]].forEach(([st,d])=>setTimeout(()=>{pluck(freq(523,st),0.12,1.6,'triangle');pluck(freq(523,st+12),0.05,1.2,'sine')},d))}
  return{unlock,setVol,retune,chime,rare,bell,fanfare};
})();
document.addEventListener('pointerdown',()=>{audio.unlock();if(typeof $('pipVideo').webkitSetPresentationMode==='function')preparePip()});document.addEventListener('keydown',()=>audio.unlock());

// ---------- boot ----------
renderAll();
if(!S.char)showCharSelect();
</script>
