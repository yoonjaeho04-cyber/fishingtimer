<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#15121b;color:#cfc6b8;font:12px sans-serif;padding:14px}
h1{font-size:15px;color:#d9b05a;margin:0 0 4px}.hd{color:#7d7488;font-size:11px;margin-bottom:10px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.c{background:#0c0a10;border:2px solid #2b2434;padding:8px}
.row{display:flex;gap:10px;align-items:center}canvas{image-rendering:pixelated;background:#0e1a28;display:block}
.l{font-size:11px;color:#7d7488;text-align:center;margin-top:3px}</style>
<h1>같은 화면 크기, 해상도만 2배 — 48×32 vs 96×64</h1><div class="hd">각 칸: 왼쪽 48×32를 4배로(192px) · 오른쪽 96×64를 2배로(192px). 화면 크기는 같고 점 밀도만 4배.</div>
<body><div class="g" id="g"></div></body>
<script src="old.js"></script><script src="fish2.js"></script><script src="species.js"></script>
<script>['0-6','0-8','0-9','0-11','2-9','4-5','3-5','1-3','2-10','3-9','4-11','3-11'].forEach(id=>{const f=fishById(id);const c=document.createElement('div');c.className='c';c.innerHTML=`<b>${f.name}</b>`;const r=document.createElement('div');r.className='row';
 const a=document.createElement('canvas');a.width=48;a.height=32;a.style.cssText='width:192px;height:128px';a.getContext('2d').drawImage(renderFish(FISH2[id],f.r),0,0);
 const b=document.createElement('canvas');b.width=96;b.height=64;b.style.cssText='width:192px;height:128px';b.getContext('2d').drawImage(renderFish(FISH2[id],f.r,2),0,0);
 const w1=document.createElement('div');w1.append(a);w1.insertAdjacentHTML('beforeend','<div class="l">48×32 (지금 시안)</div>');const w2=document.createElement('div');w2.append(b);w2.insertAdjacentHTML('beforeend','<div class="l">96×64 (2배 해상도)</div>');
 r.append(w1,w2);c.append(r);g.append(c)})</script>
