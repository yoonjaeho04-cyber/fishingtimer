<script>const RAR=['흔함','희귀','영웅','전설','신화'];

 sp.fish.forEach(f=>{if(!FISH2[f.id])return;const d=document.createElement('div');const c=document.createElement('canvas');c.width=48;c.height=32;c.getContext('2d').drawImage(renderFish(FISH2[f.id],f.r),0,0);const t=document.createElement('div');t.innerHTML=`${f.name} <span class="r${f.r}">${RAR[f.r]}</span>`;d.append(c,t);g.append(d)});document.body.append(g)});</script>
