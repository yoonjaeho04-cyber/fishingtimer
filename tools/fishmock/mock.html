<!doctype html><meta charset="utf-8"><title>물고기 시안</title>
<style>body{margin:0;background:#15121b;color:#cfc6b8;font:12px sans-serif;padding:14px}
h1{font-size:15px;color:#d9b05a;margin:0 0 4px}.hd{color:#7d7488;font-size:11px;margin-bottom:10px}
h2{font-size:13px;color:#d9b05a;margin:14px 0 6px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.c{background:#0c0a10;border:2px solid #2b2434;padding:6px;display:grid;grid-template-columns:60px 96px;gap:8px;align-items:center}
.c .n{grid-column:1/3;font-size:12px}.c small{color:#7d7488;margin-left:4px}
canvas{image-rendering:pixelated;background:#0e1a28;display:block}
.r0{color:#9a9488}.r1{color:#6aa36a}.r2{color:#5aa6dc}.r3{color:#b07fe0}.r4{color:#e0b24e}</style>
<h1>물고기 디자인 — 지금(24×16) → 새 디자인(48×32)</h1><div class="hd">왼쪽: 지금 도감 크기 · 오른쪽: 새 디자인을 도감 칸 크기(2배)로</div>
<div id="list"></div>
<script src="old.js"></script><script src="fish2.js"></script><script src="species.js"></script>
<script>const RAR=['흔함','희귀','영웅','전설','신화'];
SPOTS.forEach(sp=>{const h=document.createElement('h2');h.textContent=sp.name;list.append(h);const g=document.createElement('div');g.className='g';
 sp.fish.forEach(f=>{const c=document.createElement('div');c.className='c';const n=document.createElement('div');n.className='n';n.innerHTML=`${f.name}<small class="r${f.r}">${RAR[f.r]}</small>`;
  const o=document.createElement('canvas');o.width=24;o.height=16;o.style.cssText='width:60px;height:40px';o.getContext('2d').drawImage(fishCanvas(f),0,0);
  const v=document.createElement('canvas');v.width=48;v.height=32;v.style.cssText='width:96px;height:64px';if(FISH2[f.id])v.getContext('2d').drawImage(renderFish(FISH2[f.id]),0,0);
  c.append(n,o,v);g.append(c)});list.append(g)});</script>
